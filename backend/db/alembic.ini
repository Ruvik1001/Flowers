# Central Alembic config for all Flowers services.
# Run from backend/db:  DATABASE_URL=postgresql+psycopg://... alembic upgrade head
[alembic]
script_location = %(here)s/alembic
# URL is read from DATABASE_URL in alembic/env.py; this is only a local fallback.
sqlalchemy.url = postgresql+psycopg://flowers:flowers@localhost:5432/flowers

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
